services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: mlops-clickhouse
    restart: unless-stopped

    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"

    environment:
      CLICKHOUSE_DB: ecommerce
      CLICKHOUSE_USER: mlops
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Password required}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"

    mem_limit: 3g

    ulimits:
      nofile:
        soft: 262144
        hard: 262144

    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server

volumes:
  clickhouse_data:
  clickhouse_logs:
