stages:
  - lint
  - test
  - build
  - save

default:
  image: python:3.12-slim

variables:
  UV_VERSION: "0.9.18"
  PYTHONPATH: "$CI_PROJECT_DIR"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

.uv_setup:
  before_script:
    - pip install "uv==$UV_VERSION"
    - uv sync --locked

lint:
  stage: lint
  extends: .uv_setup
  script:
    - uv run --no-sync ruff check src tests
    - uv run --no-sync ruff format --check src tests

test:
  stage: test
  extends: .uv_setup
  script:
    - uv run --no-sync python -m pytest -q tests/unit

build:
  stage: build
  image:
    name: moby/buildkit:rootless
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: "--oci-worker-no-process-sandbox"
  script:
    - mkdir -p output
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --output type=oci,dest=output/ecommerce-api.tar
  artifacts:
    paths:
      - output/ecommerce-api.tar
    expire_in: 7 days

save:
  stage: save
  image: alpine:3.20
  dependencies:
    - build
  script:
    - test -s output/ecommerce-api.tar
    - ls -lh output/ecommerce-api.tar
    - echo "Docker image artifact saved successfully"
