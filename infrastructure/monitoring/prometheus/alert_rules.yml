groups:
  - name: ecommerce-api-availability
    rules:
      - alert: FastAPIReplicaDown
        expr: up{job="ecommerce-fastapi"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "FastAPI replica is unavailable"
          description: "Replica {{ $labels.instance }} has been down for more than 1 minute."

      - alert: FastAPIAllReplicasDown
        expr: count(up{job="ecommerce-fastapi"} == 0) == 2
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "All FastAPI replicas are unavailable"
          description: "Both FastAPI replicas have been down for more than 1 minute."

      - alert: MLModelDegradation
        expr: ml_model_degradation_detected{data_source="production",environment="production"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "ML model quality degradation detected"
          description: "Model quality degradation exceeded configured thresholds."

      - alert: MLDataDriftDetected
        expr: ml_data_drift_detected{data_source="production",environment="production"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ML data drift detected"
          description: "Input feature distributions changed beyond configured thresholds."

      - alert: MLMonitoringStale
        expr: time() - ml_metrics_last_calculation_timestamp_seconds{data_source="production",environment="production"} > 90000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ML monitoring results are stale"
          description: "ML metrics have not been recalculated for more than 25 hours."
